# Only new conversations use this default; existing conversations keep their provider.
app.ai.default-provider=${AI_DEFAULT_PROVIDER:GEMINI}

# Named Gemini Developer API model
quarkus.langchain4j.business-gemini.chat-model.provider=ai-gemini
quarkus.langchain4j.ai.gemini.business-gemini.api-key=${GEMINI_API_KEY}
quarkus.langchain4j.ai.gemini.business-gemini.chat-model.model-id=${GEMINI_MODEL}
quarkus.langchain4j.ai.gemini.business-gemini.chat-model.temperature=0.1

# Named model on the company's Ollama server
quarkus.langchain4j.business-ollama.chat-model.provider=ollama
quarkus.langchain4j.ollama.business-ollama.base-url=${OLLAMA_BASE_URL:https://ai.llm.ensera.dev}
quarkus.langchain4j.ollama.business-ollama.chat-model.model-id=${OLLAMA_MODEL:qwen3-vl:8b-instruct-q8_0}
quarkus.langchain4j.ollama.business-ollama.chat-model.temperature=0.1
quarkus.langchain4j.ollama.business-ollama.timeout=${OLLAMA_TIMEOUT:120s}
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.enabled=false

# No embedding models are used by this application.
quarkus.langchain4j.ai.gemini.embedding-model.enabled=false
quarkus.langchain4j.ollama.embedding-model.enabled=false

# Keep the last 10 complete user turns per conversation in PostgreSQL-backed chat memory.
app.chat.memory.max-turns=10

# Local/demo browser client
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://127.0.0.1:3000}
quarkus.http.cors.methods=POST

# Blocking PostgreSQL persistence; these defaults are for local development only.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:ai_business_assistant}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_business_assistant}

# PostgreSQL creates the database; Flyway owns its schema and seed data.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file

# Endpoint tests substitute the model-facing AI services and never call either model.
%test.app.ai.default-provider=GEMINI
%test.quarkus.langchain4j.ai.gemini.business-gemini.api-key=test-api-key
%test.quarkus.langchain4j.ai.gemini.business-gemini.chat-model.model-id=test-model
%test.quarkus.langchain4j.ollama.business-ollama.base-url=http://localhost:11434
%test.quarkus.langchain4j.ollama.business-ollama.chat-model.model-id=test-model
