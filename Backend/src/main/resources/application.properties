# Gemini Developer API
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY}
quarkus.langchain4j.ai.gemini.chat-model.model-id=${GEMINI_MODEL}
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.1

# Keep the last 10 complete user turns per conversation in PostgreSQL-backed chat memory.
app.chat.memory.max-turns=10

# Local/demo browser client
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://127.0.0.1:3000}
quarkus.http.cors.methods=POST

# Blocking PostgreSQL persistence; these defaults are for local development only.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:ai_business_assistant}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_business_assistant}

# PostgreSQL creates the database; Flyway owns its schema and seed data.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file

# Unit tests do not call Gemini, so they use non-secret placeholder configuration.
%test.quarkus.langchain4j.ai.gemini.api-key=test-api-key
%test.quarkus.langchain4j.ai.gemini.chat-model.model-id=test-model
