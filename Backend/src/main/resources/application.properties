# Existing local Ollama server; install the selected model before starting.
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:Jadio/Qwen3_4b_instruct_q4km}
quarkus.langchain4j.ollama.chat-model.temperature=0.1
quarkus.langchain4j.ollama.timeout=PT2M
quarkus.langchain4j.ollama.chat-model.model-options.think=${OLLAMA_THINK:false}
quarkus.langchain4j.ollama.chat-model.model-options.return-thinking=false
# Use the installed server without starting or preloading models through Dev Services.
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.enabled=false

# Local/demo browser client
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://127.0.0.1:3000}
quarkus.http.cors.methods=POST

# Blocking PostgreSQL persistence; these defaults are for local development only.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:ai_business_assistant}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_business_assistant}

# PostgreSQL creates the database; Flyway owns its schema and seed data.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
