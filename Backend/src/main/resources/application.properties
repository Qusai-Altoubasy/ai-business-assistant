# Gemini Developer API
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY}
quarkus.langchain4j.ai.gemini.chat-model.model-id=${GEMINI_MODEL}

# Local/demo browser client
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://127.0.0.1:3000}
quarkus.http.cors.methods=POST

# Unit tests do not call Gemini, so they use non-secret placeholder configuration.
%test.quarkus.langchain4j.ai.gemini.api-key=test-api-key
%test.quarkus.langchain4j.ai.gemini.chat-model.model-id=test-model
