server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://ai-business-assistant-backend:8080;
        proxy_read_timeout 125s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
