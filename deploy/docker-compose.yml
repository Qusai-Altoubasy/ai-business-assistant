services:
  ollama:
    container_name: ai-business-assistant-ollama
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ${OLLAMA_MODELS_DIR:-/usr/share/ollama/.ollama/models}:/root/.ollama/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    container_name: ai-business-assistant-backend
    build:
      context: ../Backend
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-Jadio/Qwen3_4b_instruct_q4km}
    environment:
      OLLAMA_BASE_URL: http://ai-business-assistant-ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-Jadio/Qwen3_4b_instruct_q4km}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      DB_USERNAME: ${POSTGRES_USER:-ai_business_assistant}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      DB_URL: jdbc:postgresql://ai-business-assistant-postgres:5432/${POSTGRES_DB:-ai_business_assistant}
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    container_name: ai-business-assistant-frontend
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

  postgres:
    container_name: ai-business-assistant-postgres
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_business_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-ai_business_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai-business-assistant-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ai-business-assistant-postgres-data:
    name: ai-business-assistant-postgres-data
